<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple LMS</title>


    <!-- =========================================
         MUX PLAYER
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player@latest" defer>
    </script>


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {
            height: 60px;

            background: #111827;

            color: white;

            display: flex;
            align-items: center;

            padding: 0 25px;

            font-size: 20px;

            font-weight: bold;
        }


        /* =========================================
           MAIN LMS
        ========================================= */

        .lms-container {
            display: flex;

            height: calc(100vh - 60px);
        }


        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {
            width: 300px;

            background: white;

            border-right: 1px solid #ddd;

            overflow-y: auto;

            flex-shrink: 0;
        }


        .course-title {
            padding: 20px;

            font-size: 18px;

            font-weight: bold;

            border-bottom: 1px solid #eee;
        }


        .lesson {
            padding: 16px 20px;

            border-bottom: 1px solid #eee;

            cursor: pointer;

            transition: background 0.2s;
        }


        .lesson:hover {
            background: #f3f4f6;
        }


        .lesson.active {
            background: #e8f0ff;

            border-left: 4px solid #2563eb;

            padding-left: 16px;
        }


        .lesson-title {
            font-size: 15px;

            font-weight: 500;

            line-height: 1.4;
        }


        .lesson-duration {
            font-size: 12px;

            color: #777;

            margin-top: 5px;
        }


        /* =========================================
           RIGHT CONTENT
        ========================================= */

        .content {
            flex: 1;

            padding: 30px;

            overflow-y: auto;

            min-width: 0;
        }


        .video-title {
            font-size: 24px;

            font-weight: bold;

            margin-bottom: 20px;

            max-width: 1000px;
        }


        /* =========================================
           VIDEO WRAPPER
        ========================================= */

        .video-wrapper {
            position: relative;

            width: 100%;

            max-width: 1000px;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: 10px;

            overflow: hidden;
        }


        /* =========================================
           MUX PLAYER
        ========================================= */

        mux-player {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            display: block;

            --media-object-fit: contain;

        }


        /* =========================================
           DESCRIPTION
        ========================================= */

        .description {

            max-width: 1000px;

            margin-top: 20px;

            background: white;

            padding: 20px;

            border-radius: 10px;
        }


        .description h3 {

            margin-bottom: 10px;
        }


        .description p {

            color: #666;

            line-height: 1.6;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1024px) {

            .sidebar {

                width: 260px;
            }


            .content {

                padding: 20px;
            }


            .video-title {

                font-size: 22px;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {

            .header {

                height: 55px;

                padding: 0 15px;

                font-size: 18px;
            }


            .lms-container {

                flex-direction: column;

                height: auto;
            }


            .sidebar {

                width: 100%;

                height: auto;

                max-height: 280px;

                border-right: none;

                border-bottom: 1px solid #ddd;
            }


            .course-title {

                padding: 15px;

                font-size: 17px;
            }


            .lesson {

                padding: 14px 15px;
            }


            .lesson.active {

                padding-left: 11px;
            }


            .content {

                padding: 15px;

                overflow-y: visible;
            }


            .video-title {

                font-size: 19px;

                line-height: 1.35;

                margin-bottom: 15px;
            }


            .description {

                margin-top: 15px;

                padding: 15px;
            }

        }


        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .content {

                padding: 10px;
            }


            .video-title {

                font-size: 17px;
            }

        }
    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================= -->

    <header class="header">

        Simple LMS

    </header>



    <!-- =========================================
         LMS CONTAINER
    ========================================= -->

    <div class="lms-container">


        <!-- =====================================
             SIDEBAR
        ====================================== -->

        <aside class="sidebar">


            <div class="course-title">

                NCOD

            </div>


            <!-- =================================
                 VIDEO 1
            ================================== -->

            <div class="lesson active" data-playback-id="8wE024OOwrH1igQKuSJOUjHN6XcgYenK4YDeYxcuOdXA"
                data-title="28 Feb 2023 # 2PBTB, RBS, TBS, Range Markeing Detail, Demand Zone.">

                <div class="lesson-title">

                    28 Feb 2023 # 2PBTB, RBS, TBS...

                </div>


                <div class="lesson-duration">

                    Video

                </div>

            </div>


        </aside>



        <!-- =====================================
             RIGHT CONTENT
        ====================================== -->

        <main class="content">


            <h1 class="video-title" id="videoTitle">

                28 Feb 2023 # 2PBTB, RBS, TBS,
                Range Markeing Detail, Demand Zone.

            </h1>



            <!-- =================================
                 MUX VIDEO
            ================================== -->

            <div class="video-wrapper" id="videoWrapper">


                <mux-player id="muxPlayer" playback-id="8wE024OOwrH1igQKuSJOUjHN6XcgYenK4YDeYxcuOdXA"
                    metadata-video-title="28 Feb 2023 # 2PBTB, RBS, TBS, Range Markeing Detail, Demand Zone."
                    poster="https://image.mux.com/8wE024OOwrH1igQKuSJOUjHN6XcgYenK4YDeYxcuOdXA/thumbnail.png?width=214&height=121&time=932"
                    controls playsinline>
                </mux-player>


            </div>



            <!-- =================================
                 DESCRIPTION
            ================================== -->

            <div class="description">


                <h3>

                    About this lesson

                </h3>


                <p id="descriptionText">

                    You are currently watching this lesson.

                </p>


            </div>


        </main>


    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        /* =====================================
           ELEMENTS
        ===================================== */

        const lessons =
            document.querySelectorAll(".lesson");


        const muxPlayer =
            document.getElementById("muxPlayer");


        const videoTitle =
            document.getElementById("videoTitle");


        const descriptionText =
            document.getElementById("descriptionText");



        /* =====================================
           LESSON CLICK
        ===================================== */

        lessons.forEach(function (lesson) {


            lesson.addEventListener("click", function () {


                /* -------------------------------
                   Remove active state
                -------------------------------- */

                lessons.forEach(function (item) {

                    item.classList.remove("active");

                });


                /* -------------------------------
                   Add active state
                -------------------------------- */

                lesson.classList.add("active");


                /* -------------------------------
                   Get Mux Playback ID
                -------------------------------- */

                const playbackId =
                    lesson.getAttribute(
                        "data-playback-id"
                    );


                /* -------------------------------
                   Get lesson title
                -------------------------------- */

                const title =
                    lesson.getAttribute(
                        "data-title"
                    );


                /* -------------------------------
                   Change Mux video
                -------------------------------- */

                muxPlayer.setAttribute(
                    "playback-id",
                    playbackId
                );


                /* -------------------------------
                   Change video title
                -------------------------------- */

                videoTitle.textContent =
                    title;


                /* -------------------------------
                   Change description
                -------------------------------- */

                descriptionText.textContent =
                    "You are currently watching: "
                    + title;

                /* -------------------------------
                   Scroll to video on mobile
                -------------------------------- */
                document
                    .querySelector(".content")
                    .scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
            });
        });
    </script>
</body>

</html>
